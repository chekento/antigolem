name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'about.html'
      - 'methodology.html'
      - 'local-ai.html'
      - 'privacy.html'
      - '404.html'
      - 'styles.css'
      - 'app.js'
      - 'report-i18n.js'
      - 'locale-bootstrap.js'
      - 'advanced-stats.js'
      - 'local-ai.js'
      - 'editor-tools.js'
      - 'workbench.js'
      - 'share-tools.js'
      - 'export-tools.js'
      - 'manifest.webmanifest'
      - 'assets/brand/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate web JavaScript
        run: |
          node --check app.js
          node --check report-i18n.js
          node --check locale-bootstrap.js
          node --check advanced-stats.js
          node --check local-ai.js
          node --check editor-tools.js
          node --check workbench.js
          node --check share-tools.js
          node --check export-tools.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build installable test APK
        run: gradle -p android clean :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AntiGolem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AntiGolem-APK
          path: AntiGolem.apk
          if-no-files-found: error
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='AntiGolem 1.5.1 test build: Circle Select is now a true freehand lasso instead of a stretched oval. The full finger path is stored as a polygon; accessibility text is selected against that real shape, and Android 11+ Circle OCR masks everything outside the hand-drawn polygon before bundled on-device ML Kit recognition. Includes the 1.5 forensic heatmap, explainable scoring, before/after diff and version history, Reply Studio with grounded counts/percentages and multiple tones, Document Lab, TXT/Markdown/PDF export, floating quick-result dashboard, API-free analysis and local AI paths. Debug-signed; production distribution should use a private stable signing key.'
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AntiGolem.apk --clobber
            gh release edit latest --target "$GITHUB_SHA" --title 'AntiGolem 1.5.1 — Freehand Circle Select APK' --notes "$NOTES" --latest
          else
            gh release create latest AntiGolem.apk --target "$GITHUB_SHA" --title 'AntiGolem 1.5.1 — Freehand Circle Select APK' --notes "$NOTES" --latest
          fi
