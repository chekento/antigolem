name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'report-i18n.js'
      - 'manifest.webmanifest'
      - 'privacy.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build installable test APK
        run: gradle -p android clean :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AntiGolem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AntiGolem-APK
          path: AntiGolem.apk
          if-no-files-found: error
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AntiGolem.apk \
            --target "$GITHUB_SHA" \
            --title 'AntiGolem — latest Android test APK' \
            --notes 'Automated local-first AntiGolem test build. Debug-signed: uninstall an older CI build if Android reports a signature mismatch. Production distribution should use a private stable signing key.' \
            --latest
