<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a16"/><stop offset="1" stop-color="#11112b"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#755cff"/><stop offset=".5" stop-color="#25b8ff"/><stop offset="1" stop-color="#26e6cc"/></linearGradient></defs><rect width="1600" height="780" rx="44" fill="url(#bg)"/><path d="M0 640C310 520 450 720 780 590s430-10 820-175" fill="none" stroke="#276cff" stroke-width="20" opacity=".18"/><path d="M0 680C300 550 510 730 825 610s450 35 775-130" fill="none" stroke="#8a4eff" stroke-width="13" opacity=".16"/><text x="82" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#f5f9ff">Anti<tspan fill="#47d8ff">Golem</tspan></text><text x="82" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" fill="#f7fbff">make your texts</text><text x="82" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="96" font-weight="850" fill="url(#g)">less harming</text><text x="82" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#b8c9e5">Clarify tone. Reduce unintended damage.</text><text x="82" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#b8c9e5">Improve wording with full-text analysis.</text><g transform="translate(900 108)" font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="620" height="550" rx="38" fill="#081526" stroke="#2b5794" stroke-width="3"/><text x="38" y="60" font-size="21" fill="#93afd8">ORIGINAL TEXT</text><rect x="38" y="82" width="544" height="148" rx="20" fill="#10182b" stroke="#74364d"/><text x="66" y="127" font-size="24" fill="#edf5ff">“You never listen and always</text><text x="66" y="163" font-size="24" fill="#edf5ff">make this harder. I’m done</text><text x="66" y="199" font-size="24" fill="#edf5ff">dealing with this.”</text><text x="40" y="276" font-size="18" fill="#ff7b92">● Harsh tone   ● Blame language   ● Escalation</text><text x="38" y="337" font-size="21" fill="#7fe9dc">IMPROVED VERSION</text><rect x="38" y="360" width="544" height="148" rx="20" fill="#0d2130" stroke="#257c78"/><text x="66" y="405" font-size="24" fill="#edf5ff">“I’m frustrated because I don’t</text><text x="66" y="441" font-size="24" fill="#edf5ff">feel heard. Can we find a clearer</text><text x="66" y="477" font-size="24" fill="#edf5ff">way to handle this together?”</text><text x="40" y="538" font-size="18" fill="#7fe9dc">✓ More constructive   ✓ Less blaming   ✓ Clearer intent</text></g><text x="82" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#56deff">SAFER CONVERSATIONS · CLEARER COMMUNICATION · BETTER HABITS</text></svg>