<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a16"/><stop offset="1" stop-color="#071a32"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#785cff"/><stop offset=".48" stop-color="#22b5ff"/><stop offset="1" stop-color="#2be8c9"/></linearGradient></defs><rect width="1600" height="780" rx="44" fill="url(#bg)"/><circle cx="1390" cy="70" r="330" fill="#5038ff" opacity=".08"/><text x="82" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#f5f9ff">Anti<tspan fill="#47d8ff">Golem</tspan></text><text x="82" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" fill="#f7fbff">avoid your own</text><text x="82" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="96" font-weight="850" fill="url(#g)">threat</text><text x="82" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#b8c9e5">Detect self-sabotaging phrasing, ghost-context,</text><text x="82" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#b8c9e5">and harmful framing before you publish.</text><g transform="translate(905 110)" font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="615" height="540" rx="38" fill="#081526" stroke="#2b5794" stroke-width="3"/><text x="40" y="56" font-size="20" fill="#ff7e93">POTENTIAL RISKS</text><rect x="40" y="80" width="535" height="145" rx="20" fill="#151425" stroke="#82384d"/><text x="68" y="125" font-size="24" fill="#eff5ff">“I’m probably overreacting, but</text><text x="68" y="162" font-size="24" fill="#eff5ff">whatever, it’s fine if you ignore</text><text x="68" y="199" font-size="24" fill="#eff5ff">this...”</text><text x="48" y="269" font-size="18" fill="#ff8299">● self-undermining   ● dismissal cue   ● weak agency</text><text x="40" y="330" font-size="20" fill="#78eadc">CLEARER ALTERNATIVE</text><rect x="40" y="354" width="535" height="145" rx="20" fill="#0d2130" stroke="#267c78"/><text x="68" y="399" font-size="24" fill="#eff5ff">“I’d like to share this because it’s</text><text x="68" y="436" font-size="24" fill="#eff5ff">important to me. Let me know</text><text x="68" y="473" font-size="24" fill="#eff5ff">your thoughts.”</text><text x="48" y="526" font-size="18" fill="#79e9dc">✓ stronger agency   ✓ clearer intent   ✓ constructive response</text></g><g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700"><text x="82" y="650" fill="#62ddff">⌕ CATCH RISKY PATTERNS</text><text x="390" y="650" fill="#a48bff">⬡ GET CLEARER ALTERNATIVES</text><text x="780" y="650" fill="#5be1c8">▥ BUILD BETTER HABITS</text></g><text x="82" y="711" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="4" fill="#8aa9cf">PROTECT YOUR IDEAS · PROTECT YOUR INTENT · KEEP AGENCY VISIBLE</text></svg>