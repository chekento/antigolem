plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.kosch.antigolem'
    compileSdk 35

    defaultConfig {
        applicationId 'cloud.kosch.antigolem'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

final def sharedWebRoot = file("${rootDir}/..")
final def androidAssets = file("${projectDir}/src/main/assets")

tasks.register('syncWebAssets', Copy) {
    from(sharedWebRoot) {
        include 'index.html', 'styles.css', 'app.js', 'manifest.webmanifest', 'privacy.html'
    }
    into(androidAssets)
}

preBuild.dependsOn tasks.named('syncWebAssets')
