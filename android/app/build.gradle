plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.kosch.antigolem'
    compileSdk 35

    defaultConfig {
        applicationId 'cloud.kosch.antigolem'
        minSdk 26
        targetSdk 35
        versionCode 106
        versionName '1.4.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

final def sharedWebRoot = file("${rootDir}/..")
final def androidAssets = file("${projectDir}/src/main/assets")

tasks.register('syncWebAssets', Copy) {
    from(sharedWebRoot) {
        include 'index.html', 'about.html', 'methodology.html', 'local-ai.html', 'privacy.html', '404.html'
        include 'styles.css', 'app.js', 'report-i18n.js', 'locale-bootstrap.js', 'advanced-stats.js', 'local-ai.js', 'editor-tools.js', 'manifest.webmanifest'
        include 'assets/brand/**'
    }
    into(androidAssets)
}

preBuild.dependsOn tasks.named('syncWebAssets')
